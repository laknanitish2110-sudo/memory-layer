<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeAssist — AI Coding Helper</title>
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --accent: #2563eb;
      --accent-light: #eff6ff;
      --accent-dark: #1d4ed8;
      --green: #16a34a;
      --green-light: #f0fdf4;
      --amber: #d97706;
      --amber-light: #fffbeb;
      --red: #dc2626;
      --red-light: #fef2f2;
      --purple: #7c3aed;
      --purple-light: #f5f3ff;
      --code-bg: #1e293b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    .header {
      background: var(--code-bg);
      color: white;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header-icon {
      width: 36px;
      height: 36px;
      background: var(--accent);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-weight: 700;
    }
    .header h1 { font-size: 1rem; font-weight: 700; }
    .header p { font-size: 0.75rem; color: #94a3b8; }
    .header-right { margin-left: auto; }
    .user-badge {
      font-size: 0.75rem;
      background: rgba(255,255,255,0.1);
      color: #93c5fd;
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 500;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 24px 16px 60px;
    }

    .setup-screen {
      max-width: 400px;
      margin: 80px auto;
      padding: 0 16px;
      text-align: center;
    }
    .setup-screen h2 { font-size: 1.5rem; margin-bottom: 8px; }
    .setup-screen p { color: var(--muted); font-size: 0.9rem; margin-bottom: 24px; line-height: 1.5; }
    .setup-screen input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid var(--border);
      border-radius: 12px;
      font-size: 1rem;
      text-align: center;
      outline: none;
    }
    .setup-screen input:focus { border-color: var(--accent); }
    .setup-screen .start-btn {
      margin-top: 16px;
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    .setup-screen .start-btn:hover { background: var(--accent-dark); }

    .loading {
      text-align: center;
      padding: 80px 16px;
    }
    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading p { color: var(--muted); font-size: 0.9rem; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .context-card {
      background: var(--accent-light);
      border: 2px solid #bfdbfe;
      border-radius: 16px;
      padding: 20px 24px;
      margin-bottom: 20px;
      animation: fadeUp 0.5s ease;
    }
    .context-card h3 {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .context-card p {
      font-size: 0.92rem;
      line-height: 1.7;
      color: #1e40af;
    }

    .greeting-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px 24px;
      margin-bottom: 20px;
      animation: fadeUp 0.5s ease 0.2s both;
    }
    .greeting-card .assistant-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 8px;
    }
    .greeting-card p {
      font-size: 0.95rem;
      line-height: 1.7;
    }
    .greeting-card pre {
      background: var(--code-bg);
      color: #e2e8f0;
      padding: 16px;
      border-radius: 10px;
      margin: 14px 0 4px;
      overflow-x: auto;
      font-size: 0.82rem;
      line-height: 1.6;
    }

    .dashboard {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
      animation: fadeUp 0.5s ease 0.4s both;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
    }
    .stat-card .label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .stat-card .value {
      font-size: 1.3rem;
      font-weight: 700;
    }
    .stat-card .sub {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .sentiment-bars {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }
    .sentiment-bar {
      flex: 1;
      height: 8px;
      border-radius: 4px;
      position: relative;
    }
    .sentiment-bar .tooltip {
      display: none;
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--text);
      color: white;
      font-size: 0.65rem;
      padding: 2px 6px;
      border-radius: 4px;
      white-space: nowrap;
    }
    .sentiment-bar:hover .tooltip { display: block; }

    .triggers-section {
      background: var(--red-light);
      border: 1px solid #fecaca;
      border-radius: 12px;
      padding: 16px;
      grid-column: 1 / -1;
    }
    .triggers-section .label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--red);
      margin-bottom: 8px;
    }
    .trigger-tag {
      display: inline-block;
      background: white;
      border: 1px solid #fecaca;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      margin: 0 4px 4px 0;
      color: #991b1b;
    }

    .aha-banner {
      background: linear-gradient(135deg, #1e293b, #334155);
      color: white;
      border-radius: 16px;
      padding: 24px;
      text-align: center;
      animation: fadeUp 0.5s ease 0.6s both;
    }
    .aha-banner h3 {
      font-size: 1rem;
      margin-bottom: 8px;
      color: #fbbf24;
    }
    .aha-banner p {
      font-size: 0.85rem;
      line-height: 1.6;
      color: #cbd5e1;
    }
    .aha-banner strong { color: white; }
    .aha-banner .back-link {
      display: inline-block;
      margin-top: 16px;
      color: #93c5fd;
      font-size: 0.85rem;
      text-decoration: none;
    }
    .aha-banner .back-link:hover { color: white; }

    .no-data {
      text-align: center;
      padding: 60px 16px;
      animation: fadeUp 0.4s ease;
    }
    .no-data h3 { font-size: 1.1rem; margin-bottom: 8px; }
    .no-data p { color: var(--muted); font-size: 0.9rem; margin-bottom: 20px; }
    .no-data a {
      display: inline-block;
      padding: 12px 28px;
      background: #ea580c;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-icon">&gt;_</div>
    <div>
      <h1>CodeAssist</h1>
      <p>AI Coding Helper</p>
    </div>
    <div class="header-right">
      <span class="user-badge" id="userBadge" style="display:none"></span>
    </div>
  </div>

  <div id="setup" class="setup-screen">
    <h2>Open Code Assistant</h2>
    <p>Enter the same user ID you used in the Tutor app. This is a <strong>completely different application</strong> — it has never seen your tutor sessions.</p>
    <input id="userId" value="" placeholder="Your user ID" />
    <button class="start-btn" onclick="startSession()">Start Session</button>
  </div>

  <div id="loading" class="loading" style="display:none">
    <div class="loading-spinner"></div>
    <p>Connecting to Memory Layer...</p>
  </div>

  <div id="content" class="container" style="display:none"></div>

  <script>
    const params = new URLSearchParams(window.location.search);
    if (params.get('userId')) {
      document.getElementById('userId').value = params.get('userId');
    }

    async function startSession() {
      const userId = document.getElementById('userId').value.trim();
      if (!userId) return;

      document.getElementById('setup').style.display = 'none';
      document.getElementById('loading').style.display = 'block';
      document.getElementById('userBadge').textContent = userId;
      document.getElementById('userBadge').style.display = 'block';

      const [ctxRes, summaryRes] = await Promise.all([
        fetch(`/api/profile/${encodeURIComponent(userId)}/context`).then(r => r.json()),
        fetch(`/api/profile/${encodeURIComponent(userId)}/summary`).then(r => r.json()),
      ]);

      await new Promise(r => setTimeout(r, 1200));
      document.getElementById('loading').style.display = 'none';

      const content = document.getElementById('content');
      content.style.display = 'block';

      if (!ctxRes.context) {
        content.innerHTML = `
          <div class="no-data">
            <h3>No memory found for "${userId}"</h3>
            <p>Complete a tutoring session first so the Code Assistant has something to remember.</p>
            <a href="/tutor.html">Start Tutor Session</a>
          </div>`;
        return;
      }

      const summary = summaryRes;
      const greeting = buildGreeting(ctxRes.context, summary);
      const sentimentColors = {
        positive: '#22c55e',
        excited: '#3b82f6',
        neutral: '#94a3b8',
        confused: '#a855f7',
        frustrated: '#ef4444',
      };

      const total = summary.totalInteractions || 1;
      const bars = Object.entries(summary.sentimentDistribution || {})
        .filter(([, count]) => count > 0)
        .map(([sentiment, count]) =>
          `<div class="sentiment-bar" style="background:${sentimentColors[sentiment]};flex:${count}">
            <span class="tooltip">${sentiment}: ${count}</span>
          </div>`
        ).join('');

      const engagementPct = Math.round((summary.averageEngagement || 0) * 100);
      const engagementLabel = engagementPct >= 70 ? 'High' : engagementPct >= 40 ? 'Medium' : 'Low';

      const triggers = (summary.frustrationTriggers || [])
        .map(t => `<span class="trigger-tag">${t}</span>`).join('');

      content.innerHTML = `
        <div class="context-card">
          <h3>&#x1f9e0; What Memory Layer knows about this user</h3>
          <p>${ctxRes.context}</p>
        </div>

        <div class="greeting-card">
          <div class="assistant-label">CodeAssist says:</div>
          ${greeting}
        </div>

        <div class="dashboard">
          <div class="stat-card">
            <div class="label">Sessions Tracked</div>
            <div class="value">${summary.totalInteractions}</div>
            <div class="sub">across all apps</div>
          </div>
          <div class="stat-card">
            <div class="label">Engagement</div>
            <div class="value">${engagementPct}%</div>
            <div class="sub">${engagementLabel}</div>
          </div>
          <div class="stat-card" style="grid-column:1/-1">
            <div class="label">Sentiment Distribution</div>
            <div class="sentiment-bars">${bars || '<span style="font-size:0.8rem;color:var(--muted)">No data</span>'}</div>
          </div>
          ${triggers ? `
          <div class="triggers-section">
            <div class="label">Frustration Triggers</div>
            ${triggers}
          </div>` : ''}
        </div>

        <div class="aha-banner">
          <h3>This is the magic.</h3>
          <p>CodeAssist has <strong>never seen your tutor conversations</strong>. It doesn't have access to the Tutor's chat history, messages, or session data.<br><br>
          Yet it knows your learning style, your skill levels, what frustrated you, and what you're working toward — because <strong>Memory Layer</strong> shared the <em>understanding</em>, not the data.</p>
          <a href="/tutor.html" class="back-link">&larr; Back to Tutor (start fresh)</a>
        </div>
      `;
    }

    function buildGreeting(context, summary) {
      const triggers = summary.frustrationTriggers || [];
      const topics = summary.topTopics || [];
      const hasFrustration = triggers.length > 0;
      const hasRecursion = topics.includes('recursion') || context.includes('recursion');

      let greeting = '<p>';
      if (hasRecursion && hasFrustration) {
        greeting += `Hey! I can see you've been working on <strong>recursion</strong> with a tutor, and it sounds like the abstract explanations weren't clicking. I get it — let me show you recursion the way it actually makes sense, with <strong>real code</strong>:`;
        greeting += `</p>
<pre>def factorial(n):
    if n <= 1:          # base case: stop here
        return 1
    return n * factorial(n - 1)  # recursive case

# Walk through it:
# factorial(4)
#   = 4 * factorial(3)
#   = 4 * 3 * factorial(2)
#   = 4 * 3 * 2 * factorial(1)
#   = 4 * 3 * 2 * 1
#   = 24</pre>
<p>See? No nesting dolls, no mirror analogies. Just code you can run and trace. Want to try writing one together?</p>`;
      } else if (hasFrustration) {
        greeting += `Welcome! I noticed from your learning history that ${triggers.map(t => `<strong>${t}</strong>`).join(' and ')} tend to frustrate you. I'll make sure to keep things practical and example-driven.</p>`;
      } else if (topics.length > 0) {
        greeting += `Hey! Looks like you've been exploring ${topics.slice(0, 3).map(t => `<strong>${t}</strong>`).join(', ')}. Let me help you build on that foundation with hands-on coding.</p>`;
      } else {
        greeting += `Welcome! I've loaded your profile from Memory Layer. Let's dive into some coding!</p>`;
      }
      return greeting;
    }
  </script>
</body>
</html>
