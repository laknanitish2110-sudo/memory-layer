<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App A — Settings</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; max-width: 520px; margin: 40px auto; padding: 0 16px; color: #1a1a1a; }
    h1 { font-size: 1.4rem; margin-bottom: 4px; }
    .badge { display: inline-block; background: #3b82f6; color: #fff; font-size: 0.7rem; padding: 2px 8px; border-radius: 10px; margin-bottom: 20px; }
    label { display: block; font-size: 0.85rem; font-weight: 600; margin-top: 16px; }
    input, select { width: 100%; padding: 8px; margin-top: 4px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 0.9rem; }
    button { margin-top: 20px; padding: 10px 20px; background: #3b82f6; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 0.9rem; }
    button:hover { background: #2563eb; }
    .status { margin-top: 12px; font-size: 0.85rem; color: #16a34a; }
    a { display: block; margin-top: 24px; color: #3b82f6; font-size: 0.85rem; }
  </style>
</head>
<body>
  <h1>App A — User Settings</h1>
  <span class="badge">appId: settings-app</span>

  <label for="userId">User ID</label>
  <input id="userId" value="user-1" />

  <label for="name">Display Name</label>
  <input id="name" placeholder="Alice" />

  <label for="theme">Theme</label>
  <select id="theme">
    <option value="light">Light</option>
    <option value="dark">Dark</option>
    <option value="system">System</option>
  </select>

  <label for="lang">Language</label>
  <select id="lang">
    <option value="en">English</option>
    <option value="es">Spanish</option>
    <option value="fr">French</option>
  </select>

  <button onclick="save()">Save Preferences</button>
  <div class="status" id="status"></div>

  <a href="/app-b.html">Open App B (Dashboard) to see shared memory &rarr;</a>

  <script>
    async function save() {
      const userId = document.getElementById('userId').value;
      const prefs = [
        { key: 'display_name', value: document.getElementById('name').value },
        { key: 'theme', value: document.getElementById('theme').value },
        { key: 'language', value: document.getElementById('lang').value },
      ];

      for (const { key, value } of prefs) {
        if (!value) continue;
        await fetch('/api/memories', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId, key, value, appId: 'settings-app' }),
        });
      }

      document.getElementById('status').textContent =
        `Saved ${prefs.filter(p => p.value).length} preferences for ${userId}`;
    }
  </script>
</body>
</html>
